---
driver:
  name: docker
platforms:
  - name: debian-bookworm
    image: debian:bookworm
    dockerfile: Dockerfile.j2
    pre_build_image: false
    command: /lib/systemd/systemd
    privileged: true
    cgroupns_mode: host
    volumes:
      - /sys/fs/cgroup:/sys/fs/cgroup:rw
    tmpfs:
      - /run
      - /tmp
provisioner:
  name: ansible
