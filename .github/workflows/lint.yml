---
name: lint

on:
  push:
    branches:
      - main
  pull_request:

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  skills:
    name: Skill authoring rules
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          enable-cache: true
      - name: Check SKILL.md files
        run: uv run --frozen python scripts/check_skills.py

  python:
    name: Python
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          enable-cache: true
      - name: ruff check
        run: uv run --frozen ruff check .
      - name: ruff format
        run: uv run --frozen ruff format --check .
      - name: ty check
        run: uv run --frozen ty check .

  markdown:
    name: Markdown
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # Pinned rather than resolved from npm at run time, so a compromised or merely
      # changed release cannot alter what this job executes. Bump it by hand; with no
      # package.json there is nothing for Dependabot to track.
      - name: Lint Markdown
        run: npx --yes markdownlint-cli2@0.23.1 "**/*.md"
