---
name: lint

on:
  push:
    branches:
      - main
  pull_request:

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  skills:
    name: Skill authoring rules
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # The capability report below compares this branch against the base commit, so
          # the base commit has to be in the clone. Without history the script says it has
          # no baseline and exits 0, which would read as a passing check that ran nothing.
          fetch-depth: 0
      - name: Set up uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          # `auto` rather than `true`, here and in the jobs below. From v10 the default
          # disables the cache on `release`, tag push, `pull_request_target`, and
          # `workflow_run`, which is the cache-poisoning protection
          # references/supply-chain.md asks for. None of this workflow's triggers are in
          # that set, so `auto` caches exactly as `true` did, and an explicit `true`
          # would only opt out of the protection if a trigger were added later.
          enable-cache: auto
          # Only a uv release whose checksum this action already ships, so the download is
          # verified against a known value rather than trusted on arrival. Introduced in
          # setup-uv v10.
          version: latest-known
      - name: Check SKILL.md files
        run: uv run --frozen python scripts/check_skills.py
      # Reports, and does not fail. scripts/check_capabilities.py carries the reason: the
      # capability block and the body have the same author, so a contributor who adds a
      # command and declares it passes anything that can be checked here. The output is a
      # reviewer's attention list. BASE_SHA is empty on a push to main, where there is
      # nothing to compare against and origin/main stands in.
      - name: Report undeclared capabilities
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: uv run --frozen python scripts/check_capabilities.py --base "${BASE_SHA:-origin/main}"

  python:
    name: Python
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          enable-cache: auto
          version: latest-known
      - name: ruff check
        run: uv run --frozen ruff check .
      - name: ruff format
        run: uv run --frozen ruff format --check .
      - name: ty check
        run: uv run --frozen ty check .

  evals:
    name: Eval suites
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # Full history rather than the default single commit. The staleness half of this
          # check compares the commit a stamp recorded against the commits that have since
          # touched the skill it measured, and scripts/check_evals.py degrades a failed git
          # lookup to an empty string, which reads as "nothing changed". A shallow checkout
          # would therefore report every suite as fresh without having compared anything.
          fetch-depth: 0
      # No uv setup: the script is standard library only, and it needs git and bash, which
      # the runner image already provides. Not --strict, because staleness is a statement
      # about when a measurement was last taken and a pull request that does not touch a
      # skill cannot fix it; a structural error in a suite is the part that has to block.
      # The structural checks are also the slot a grader-command check belongs in, which
      # docs/controls.md records as still open.
      - name: Check eval suites
        run: python3 scripts/check_evals.py

  actions:
    name: Workflows
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          enable-cache: auto
          version: latest-known
      # The two checks skills/github/github-actions-security/SKILL.md requires of every
      # workflow change, run against this repository's own workflows at the versions that
      # skill pins. A library that publishes the rule has to meet it, and the pins move
      # only when the skill's own Verify section does. The image is pinned by digest
      # rather than by tag, which is what references/runners.md requires of a container.
      - name: actionlint
        run: |
          docker run --rm --volume "${PWD}:/repo" --workdir /repo \
            rhysd/actionlint@sha256:b1934ee5f1c509618f2508e6eb47ee0d3520686341fec936f3b79331f9315667 \
            -color
      # Scoped to .github/ rather than the repository root, for the reason pyproject.toml
      # excludes evals/*/fixtures from ruff: a fixture workflow plants the finding its
      # eval measures, and one of them references an action that does not exist, which
      # fails the ref-confusion audit outright. GITHUB_TOKEN is passed so the audits that
      # need the API run; without it zizmor falls back to reduced offline coverage.
      - name: zizmor
        env:
          GH_TOKEN: ${{ github.token }}
        run: uvx "zizmor@1.29.0" --persona=pedantic --no-progress .github/

  markdown:
    name: Markdown
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # The action rather than `npx markdownlint-cli2@<version>`, so this pin lives in
      # the github-actions ecosystem Dependabot already watches. Resolving from npm at
      # run time would let a changed release alter what this job executes, and the
      # hand-bumped npm pin it replaces had already drifted a patch release behind.
      # v24.2.0 bundles markdownlint-cli2 0.23.2.
      - name: Lint Markdown
        uses: DavidAnson/markdownlint-cli2-action@21c1be1b93ad9ed58fa840aacc3f279cde2a72ff # v24.2.0
        with:
          globs: "**/*.md"
