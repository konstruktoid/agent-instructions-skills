---
# Paths excluded from secret scanning alerts and push protection.
#
# Everything under evals/ that matches here is synthetic by construction:
# planted credentials in task fixtures, the literals the graders grep for,
# and the recorded agent transcripts that echo them back. None of it is a
# real credential, so alerts on these paths are always false positives.
#
# Scoped deliberately rather than blanket-excluding evals/, so a real secret
# committed elsewhere in the eval harness still raises an alert.
paths-ignore:
  - "evals/*/fixtures/**"
  - "evals/*/assertions.json"
  - "evals/*/results/raw/**"
