---
# Keeps this repository's pinned dependencies current. A pin makes a reference
# immutable, not up to date, so without this the versions would freeze on whatever
# happened to be current when a file was last edited by hand. See
# skills/github/github-actions-security/references/supply-chain.md.
#
# Both ecosystems share the same shape:
#
#   cooldown  Most malicious releases are found and yanked within days, so a delay
#             before adopting one absorbs a large share of the supply chain risk at
#             little cost. Under uv, majors wait longer still, because they change
#             behaviour; Dependabot only accepts the semver-aware cooldown keys for
#             ecosystems whose versions it parses as semver, which excludes
#             github-actions.
#   groups    Minor and patch bumps arrive as one pull request rather than one each.
#             Majors stay ungrouped, so each gets its own pull request and its own
#             read of the upstream release notes.
version: 2

updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    cooldown:
      default-days: 7
    groups:
      actions-minor-patch:
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"
    open-pull-requests-limit: 5

  # pyproject.toml and uv.lock. Dependabot has understood uv natively since March
  # 2025; the pip ecosystem would not keep uv.lock in step with pyproject.toml.
  - package-ecosystem: "uv"
    directory: "/"
    schedule:
      interval: "weekly"
    cooldown:
      default-days: 7
      semver-major-days: 14
    groups:
      python-minor-patch:
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"
    open-pull-requests-limit: 5
